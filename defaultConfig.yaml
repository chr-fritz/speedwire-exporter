exporter:
    port: 8080
    goMetrics: false
logging:
    level: info
    format: json
fetchInterval: 5s
interface: eth0
discovery:
    password: "0000"
    # Discovery broadcasts SMA discovery requests to the shared Speedwire multicast group, so
    # it is skipped entirely while every configured device is being read. These bound the
    # cycles that do run, when a device has never answered or has gone silent.
    interval: 5m
    window: 3s
metrics:
    energyMeterPrefix: smartmeter
    inverterPrefix: sunny_inverter
    info: false
# Note: all devices of the SAME type (e.g. all inverters, all energy meters) should
# declare the SAME set of label keys. Differing label-key sets across same-type devices
# produce metric series with inconsistent dimensions, which prometheus rejects on scrape.
# Giving a device an "address" opens it directly instead of looking for it with a multicast
# discovery broadcast. If every device is pinned this way, no discovery request is ever sent.
# Without a port - Speedwire is always on 9522.
devices: [ ]
#  - serial: 1234567890
#    address: 10.0.0.5
#    labels:
#      meter: grid
